[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repoready"
description = "Offline, read-only repository readiness checks: evidence-based findings, no scores."
requires-python = ">=3.11"
dynamic = ["version"]
license = "MIT"
readme = "README.md"

[project.scripts]
repoready = "repoready.cli:main"

[tool.setuptools.dynamic]
version = { attr = "repoready.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
