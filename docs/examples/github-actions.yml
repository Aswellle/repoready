# RepoReady 可复制 CI 门禁示例。
#
# 安装方式：git 直装（无需 PyPI，已实测可用）。若 PyPI 包已发布，
# 可把安装步骤换成 `pip install repoready`。
# `--strict` 让 warning 也算失败（退出码 1），适合作为发布前门禁；
# 首次接入的项目可以先去掉 --strict 观察基线。

name: repo-readiness

on:
  push:
  pull_request:

jobs:
  repoready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repoready
        run: pip install git+https://github.com/Aswellle/repoready
      - name: Repository readiness check
        run: repoready check . --strict
